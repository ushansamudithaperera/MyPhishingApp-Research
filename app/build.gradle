// build.gradle (app) — PhishGuard v2.0
plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.myphishingapp'
    compileSdk 36

    aaptOptions {
        noCompress "tflite"   // CRITICAL — prevents TFLite file corruption
    }

    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }

    defaultConfig {
        applicationId "com.example.myphishingapp"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // AndroidX & Material
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material                            // TabLayout, TextInputLayout, CardView
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core:1.12.0'

    // TFLite (ML model)
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-select-tf-ops:2.16.1'

    // JSON parsing (for meta.json + backend response)
    implementation 'com.google.code.gson:gson:2.10.1'

    // HTTP client (active defense backend)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ─── QR Code Scanner ────────────────────────────────────────────
    // ZXing Android Embedded (journeyapps) — easiest QR integration
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'

    // Tests
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}